<!doctype html>
<html lang="{{ language }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{{ title }}</title>
  <style>
    body { margin: 0; padding: 24px 12px; background: #f1f6f0; color: #193c2b; font-family: Arial, Helvetica, sans-serif; }
    .card { max-width: 600px; margin: 0 auto; overflow: hidden; border: 1px solid #dce9dc; border-radius: 18px; background: #fff; }
    .header { padding: 22px 28px; background: #175c3e; color: #fff; font-size: 19px; font-weight: 700; }
    .content { padding: 28px; }
    h1 { margin: 0 0 14px; color: #174e37; font-size: 24px; line-height: 1.3; }
    p { line-height: 1.6; }
    .details { margin: 22px 0; border: 1px solid #e0eae0; border-radius: 12px; }
    .row { padding: 12px 15px; border-bottom: 1px solid #e8efe8; }
    .row:last-child { border-bottom: 0; }
    .label { display: block; margin-bottom: 4px; color: #5d7666; font-size: 12px; font-weight: 700; }
    .value { color: #193c2b; overflow-wrap: anywhere; }
    .footer { padding: 16px 28px; background: #f7faf6; color: #617367; font-size: 12px; line-height: 1.5; }
    @media (max-width: 480px) { body { padding: 10px 6px; } .content { padding: 22px 18px; } .header, .footer { padding-left: 18px; padding-right: 18px; } h1 { font-size: 21px; } }
  </style>
</head>
<body>
  <main class="card">
    <div class="header">{{ brand }}</div>
    <div class="content">
      <p>{{ greeting }}</p>
      <h1>{{ title }}</h1>
      <p>{{ summary }}</p>
      {% if details %}
      <section class="details" aria-label="Transaction details">
        {% for item in details %}
        <div class="row"><span class="label">{{ item.label }}</span><span class="value">{{ item.value }}</span></div>
        {% endfor %}
      </section>
      {% endif %}
    </div>
    <footer class="footer">{{ footer }}</footer>
  </main>
</body>
</html>
